name: cogito
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  smooth_page_indicator: ^2.0.1
  material_symbols_icons: ^4.2951.0
  material_design_icons_flutter: ^7.0.7296
  http: ^1.2.2
  # Firebase — autenticação e infraestrutura de nuvem
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.5

  # Google Sign-In — autenticação OAuth com conta Google
  google_sign_in: ^6.2.1

  # Gráficos animados e utilitários
  fl_chart: ^0.70.2
  url_launcher: ^6.3.0
  local_auth: ^2.3.0
  device_info_plus: ^10.1.2
  shared_preferences: ^2.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_icons:
  android: true
  image_path: "assets/images/logo/logo.png"

flutter_native_splash:
  android: true
  color: "#244288"
  image: "assets/images/logo/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/conrado/
    - assets/images/logo/
    - assets/images/other_logo/
